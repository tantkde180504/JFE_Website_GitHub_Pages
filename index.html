<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Ôn tập JFE/FE theo chương"><title>JFE Ôn tập FE</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><h1>JFE <span>Ôn tập FE</span></h1><p>Ngân hàng câu hỏi đã lọc trùng và sắp xếp theo chương</p></div><div class="head-actions"><button id="themeBtn" title="Đổi giao diện">🌙</button><button id="exportBtn">Xuất tiến độ</button><label class="import-label">Nhập tiến độ<input id="importInput" type="file" accept="application/json"></label></div></header>
<main>
<section class="toolbar card">
<div class="row"><label>Chương<select id="chapterSelect"></select></label><label>Nguồn<select id="sourceSelect"><option value="all">Tất cả đề</option></select></label><label>Chế độ<select id="orderSelect"><option value="sequential">Lần lượt</option><option value="random">Ngẫu nhiên</option></select></label><label>Tìm câu<input id="searchInput" placeholder="Từ khóa hoặc ID"></label><button id="resetBtn" class="danger">↺ Làm lại bộ lọc</button></div>
<div class="stats"><span><b id="doneCount">0</b> đã làm</span><span class="ok"><b id="correctCount">0</b> đúng</span><span class="bad"><b id="wrongCount">0</b> sai</span><span><b id="remainingCount">0</b> còn</span></div>
<div class="progress"><i id="progressBar"></i></div>
<div class="filter-tabs"><button data-filter="all" class="active">Tất cả</button><button data-filter="wrong">Sai</button><button data-filter="unanswered">Chưa</button><button data-filter="starred">★ Đã đánh dấu</button></div>
</section>
<section class="quiz card">
<div class="meta"><span id="position"></span><span id="chapterBadge"></span><span id="sourceBadge"></span></div>
<h2 id="questionText">Đang tải…</h2><div id="options" class="options"></div>
<div id="answerBox" class="answer-box hidden"></div>
<div class="actions"><button id="prevBtn">← Trước</button><button id="starBtn">☆</button><button id="checkBtn" class="primary">Kiểm tra</button><button id="showBtn">Hiện đáp án</button><button id="nextBtn">Tiếp →</button></div>
</section>
<section class="map card"><div class="map-head"><h3>Bản đồ câu hỏi</h3><span id="mapSummary"></span></div><div id="questionMap" class="question-map"></div></section>
</main><footer>Dữ liệu được lưu cục bộ trong trình duyệt. Website hoạt động offline và có thể đưa lên GitHub Pages.</footer>
<script src="questions.js"></script><script src="app.js"></script></body></html>
